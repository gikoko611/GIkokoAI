name: G.I KO KO Automation CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "render.yaml"
      - ".github/workflows/automation-ci.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automation-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q backend
      - name: Check automation routes exist
        run: |
          python - <<'PY'
          from backend.app import app
          paths = {route.path for route in app.routes}
          required = {"/api/automation/status", "/api/automation/admin/check"}
          missing = required - paths
          if missing:
              raise SystemExit(f"Missing routes: {sorted(missing)}")
          print("Automation API routes registered successfully.")
          PY
